    <!-- Google Tag Manager. Same container, but it is fetched once the page has loaded and the browser is
         idle (or at the visitor's first touch, scroll or key press), so its scripts never compete with
         the first paint. Everything the site pushes to dataLayer before then is kept and processed when
         it starts. -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var started=false;

    j.src='https://www.googletagmanager.com/gtm.js?id='+i;d.head.appendChild(j);}
    function later(){setTimeout(function(){if(w.requestIdleCallback){w.requestIdleCallback(load,{timeout:3000});}else{load();}},2000);}
    if(d.readyState==='complete'){later();}else{w.addEventListener('load',later);}
    ['pointerdown','keydown','scroll','touchstart'].forEach(function(e){w.addEventListener(e,load,{once:true,passive:true});});
    })(window,document,'script','dataLayer','GTM-K2RL4JBL');</script>
