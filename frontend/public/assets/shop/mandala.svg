      <stop offset="0.62" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="vignette">
      <rect x="0" y="0" width="600" height="600" fill="url(#fade)"/>
    </mask>
  </defs>

