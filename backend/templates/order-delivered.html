              <td style="padding:0 3px;"><a href="{{Review URL}}&amp;rating=2" target="_blank"><img src="https://chennairiceindustries.com/assets/email/o-star.png" width="38" alt="2 stars" style="display:block; width:38px; height:auto; border:0;"></a></td>
              <td style="padding:0 3px;"><a href="{{Review URL}}&amp;rating=3" target="_blank"><img src="https://chennairiceindustries.com/assets/email/o-star.png" width="38" alt="3 stars" style="display:block; width:38px; height:auto; border:0;"></a></td>
              <td style="padding:0 3px;"><a href="{{Review URL}}&amp;rating=4" target="_blank"><img src="https://chennairiceindustries.com/assets/email/o-star.png" width="38" alt="4 stars" style="display:block; width:38px; height:auto; border:0;"></a></td>
              <td style="padding:0 3px;"><a href="{{Review URL}}&amp;rating=5" target="_blank"><img src="https://chennairiceindustries.com/assets/email/o-star.png" width="38" alt="5 stars" style="display:block; width:38px; height:auto; border:0;"></a></td>
            </tr></table>
            <!-- Button -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:18px auto 0;"><tr>
              <td bgcolor="#7a1420" style="background-color:#7a1420; border-radius:26px; box-shadow:0 6px 14px rgba(110,20,32,0.25);">

                  <img src="https://chennairiceindustries.com/assets/email/o-pen.png" width="18" alt="" style="display:inline-block; width:18px; height:auto; border:0; vertical-align:-2px;">&nbsp; Write a Review &nbsp;&rarr;
                </a>
              </td>
            </tr></table>
          </td>
        </tr>
