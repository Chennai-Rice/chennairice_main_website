<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 18px;
        font: 12px/1.5 "Inter", -apple-system, "Segoe UI", sans-serif;
        color: #33241f;
        background: #faf5e9;
      }
      h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
      p  { margin: 0 0 14px; color: #7d6a5b; }
      #bar { height: 4px; background: #e6dac2; border-radius: 2px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #7a1f2b; transition: width .2s ease; }
      #log { margin-top: 10px; color: #7d6a5b; font-variant-numeric: tabular-nums; }
      .bad { color: #a84230; }
    </style>
  </head>
  <body>
    <h1>Building the Chennai Rice pages</h1>
    <p>Fetching artwork from chennairiceindustries.com…</p>
    <div id="bar"><div id="fill"></div></div>
    <div id="log">starting…</div>

    <script>
      // The sandbox that runs code.js has no network access of its own, so the
      // images are fetched here in the iframe and handed over as raw bytes.
      const fill = document.getElementById('fill')
      const log = document.getElementById('log')

      // Tell the sandbox we are listening. Without this handshake the plugin
      // can post the job before this iframe has registered onmessage, and the
      // message is lost — the plugin then sits at "starting…" forever.
      parent.postMessage({ pluginMessage: { type: 'ready' } }, '*')

      onmessage = async event => {
        const msg = event.data.pluginMessage
        if (!msg || msg.type !== 'fetch-images') return

        const { origin, paths } = msg
        const images = []
        const failed = []

        for (let i = 0; i < paths.length; i += 1) {
          const path = paths[i]
          try {
            const res = await fetch(origin + path, { cache: 'no-cache' })
            if (!res.ok) throw new Error('HTTP ' + res.status)
            const buf = await res.arrayBuffer()
            images.push({ path, bytes: new Uint8Array(buf) })
          } catch (err) {
            // A missing image must not abort the build — the frame is simply
            // left with its flat tint, and the name is reported at the end.
            failed.push(path + ' (' + (err && err.message ? err.message : 'failed') + ')')
          }
          fill.style.width = Math.round(((i + 1) / paths.length) * 100) + '%'
          log.textContent = i + 1 + ' / ' + paths.length + ' images'
        }

        if (failed.length) {
          log.innerHTML += '<br><span class="bad">' + failed.length + ' could not be fetched</span>'
        }
        log.innerHTML += '<br>building frames…'
        parent.postMessage({ pluginMessage: { type: 'images', images, failed } }, '*')
      }
    </script>
  </body>
</html>
